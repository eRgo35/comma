[package]
name = "comma"
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
description = "Ask Claude for a shell command right at your bash or cmd prompt: type ,<what you want> and press Enter"
license = "MIT"
repository = "https://github.com/eRgo35/comma"
readme = "README.md"
keywords = ["bash", "shell", "claude", "cli", "llm"]
categories = ["command-line-utilities"]

[dependencies]
serde_json = "1"
# No gzip: replies are a few hundred bytes.
ureq = { version = "3", default-features = false, features = ["rustls"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
